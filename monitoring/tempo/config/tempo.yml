server:
  http_listen_port: 3200

distributor:
  receivers:
    otlp:
      protocols:
        grpc:
          endpoint: "0.0.0.0:4317"
        http:
          endpoint: "0.0.0.0:4318"

ingester:
  max_block_duration: 5m

compactor:
  compaction:
    compaction_window: 2h  # 프로덕션 권장값: 2시간마다 압축 수행
    max_block_bytes: 100_000_000
    block_retention: 168h  # 트레이스 실제 보존기간 (7일). compaction_window와 다른 값 — 이게 조회 가능 기간
    compacted_block_retention: 1h  # 압축 완료돼 대체된 원본 블록 삭제 유예 (기본값). 조회 보존기간 아님

storage:
  trace:
    backend: local
    wal:
      path: /tmp/tempo/wal
    local:
      path: /tmp/tempo/blocks

metrics_generator:
  registry:
    external_labels:
      source: tempo
      cluster: docker-compose
  storage:
    path: /tmp/tempo/generator/wal
    remote_write:
      - url: http://prometheus:9090/api/v1/write
        send_exemplars: true
  processor:
    service_graphs:
      wait: 10s
      max_items: 10000
    span_metrics:
      dimensions:
        - service
        - operation

overrides:
  defaults:
    metrics_generator:
      processors: [service-graphs, span-metrics] 