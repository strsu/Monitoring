map $http_upgrade $connection_upgrade {
  default upgrade;
  '' close;
}

server {
    listen 80 http2;
    server_name monitoring.prup.xyz;

    # SSL로 리다이렉트 (선택 사항)
    # return 301 https://$host$request_uri;

    # 루트 경로 처리
    location = / {
        proxy_pass http://grafana:3000;
        proxy_set_header Host $http_host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # 일반 경로 처리
    location / {
        proxy_pass http://grafana:3000;
        proxy_set_header Host $http_host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # Grafana WebSocket 연결
    location /api/live/ {
        proxy_pass http://grafana:3000/api/live/;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection $connection_upgrade;
        proxy_set_header Host $http_host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # Prometheus 프록시
    location /prometheus/ {
        proxy_pass http://prometheus:9090/;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # Loki 프록시
    location /loki/ {
        proxy_pass http://loki:3100; # 뒤에 /로 끝나면 라우팅이 제대로 안된다!!!
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # Alertmanager 프록시
    location /alertmanager/ {
        proxy_pass http://alertmanager:9093/;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }


    # Tempo OTLP HTTP 수신기 (모든 OTLP HTTP 엔드포인트 지원)
    # location과 proxy_pass 양쪽 트레일링 슬래시 필수: /tempo/otlp/ 프리픽스를 벗겨
    # 업스트림에 /v1/traces 로 전달해야 함. 슬래시를 빼면 tempo가 /tempo/otlp/v1/traces 를
    # 그대로 받아 404가 됨 (2026-07-18 회귀 수정 — 커밋 a956b08 역전)
    location /tempo/otlp/ {
        client_max_body_size 50M; # 큰 규모의 트레이스 배치 수집 허용
        proxy_pass http://tempo:4318/;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header Content-Type $content_type;
    }

    # Pyroscope 프록시 (UI 접근용)
    location /pyroscope/ {
        proxy_pass http://pyroscope:4040/;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # Pyroscope OTLP HTTP 수신기 (프로파일 데이터 수집용)
    location /pyroscope/ingest/ {
        proxy_pass http://pyroscope:4040/ingest/;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header Content-Type $content_type;
    }
}

